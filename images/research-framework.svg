    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#80929f" stroke-width="1.3"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#263641}
      .heading{font-size:25px;font-weight:600}
      .body{font-size:20px;fill:#566771}
      .small{font-size:18px;fill:#566771}
      .label{font-size:13px;letter-spacing:2px;fill:#72818c}
      .flow{fill:none;stroke:#a2afb8;stroke-width:1.4}
    </style>
  </defs>
