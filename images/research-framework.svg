<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Research framework</title>
  <desc id="desc">Mechanistic interpretability and reinforcement learning inform two goals: AI researchers and scientists, and user collaborators. Frontier capability evaluation supports both goals. Users, agents and environments interact through a feedback loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#80929f" stroke-width="1.3"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#263641}
      .label{font-size:13px;letter-spacing:2px;fill:#72818c}
      .heading{font-size:25px;font-weight:600}
      .body{font-size:19px;fill:#566771}
      .note{font-size:17px;fill:#657782}
      .flow{fill:none;stroke:#a2afb8;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1000" height="570" fill="#fff"/>
  <text x="34" y="26" class="label">FOUNDATIONS</text>
  <text x="263" y="72" text-anchor="middle" class="heading">Mechanistic interpretability</text>
  <text x="737" y="72" text-anchor="middle" class="heading">Reinforcement learning</text>
  <text x="263" y="103" text-anchor="middle" class="body">Understand model mechanisms</text>
  <text x="737" y="103" text-anchor="middle" class="body">Improve models through interaction</text>
