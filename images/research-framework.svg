<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Research interests</title>
  <desc id="desc">User collaborator agents from real user interaction, with two parallel directions: user modeling and long-horizon agentic alignment. Related research areas include long-horizon tasks, model capability improvement and training stability; benchmark design and execution-based assessment; data synthesis, environment generation and post-training.</desc>
